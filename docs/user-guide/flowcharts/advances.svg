<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 455" width="1040" height="455" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Travel advances: settle the amount already paid.</title><desc id="chart-description">Start only after a travel voucher is paid. Track the accountable person’s use of the advance, accepted expenses and returned cash without recording a second payment. Treasurer: 1. Confirm travel DV: is already Paid: Check amount and payee. Decision: Cash advance: to a person?: Office classification check. Super admin: 2. Open advance: from paid travel DV: Cash advances → Open advance. Accountable person: 3. Provide receipts: and cash-return proof: Office handoff of evidence. Treasurer / Super admin: 4. Check accepted: amounts and evidence: Coordinate the accepted entries. Super admin: 5. Record accepted: expense / cash refund: View advance → record entry. Decision: Outstanding: balance zero?: Advance − expenses − refunds. Treasurer / Auditor: 6. Verify settled: advance and reports: Retain DV and evidence refs. Accountable person: Supply remaining: evidence / unused cash: Keep the balance outstanding. Treasurer / Auditor: Standard paid case: No advance to open: Continue normal reconciliation</desc>
<defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486a7d"/></marker><marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a63b2c"/></marker><marker id="arrow-handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#788d9a"/></marker></defs>
