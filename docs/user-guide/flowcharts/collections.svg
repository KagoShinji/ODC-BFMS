<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Collections: from payer details to confirmed treasury matching.</title><desc id="chart-description">Follow each receipt into its bank deposit or treasury remittance. Collector prepares and checks; Treasurer checks treasury evidence; Super admin records receipts and matching batches in the current live app. Collector: 1. Check payer: category and amount: Search for an existing receipt. Super admin: 2. Record collection: and issue receipt: Confirm details → save receipt. Collector: 3. Verify receipt: and unmatched amount: Keep generated receipt number. Treasurer / Collector: 4. Check real deposit: or remittance evidence: Bank / recipient and reference. Super admin: 5. New matching batch: Select receipt amounts: Choose deposit or remittance. Decision: Evidence and: allocations agree?: Office check + amount validation. Super admin: 6. Confirm matching: batch and reference: Check saved batch / allocations. Decision: Receipt fully: matched?: Check remaining unmatched. Collector / Auditor: 7. Reconcile matching: RCD / RCR and cashbook: Match receipt + batch references. Collector / Treasurer: Carry unmatched: balance to later batch: Partial allocation stays visible. Treasurer / Super admin: Correct allocation: or investigate evidence: Keep batch unconfirmed</desc>
<defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486a7d"/></marker><marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a63b2c"/></marker><marker id="arrow-handoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#788d9a"/></marker></defs>
