<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">The whole system: roles, actions and handoffs.</title><desc id="chart-description">Start at 1. Complete setup, follow the spending or collection branch, then reconcile the resulting records. Each box names the responsible role and who saves in the current live app. Super admin: 1. Onboard barangay: and set branding: Live save: Super admin. Administrator: 2. Assign staff roles: and allowed pages: Super admin assigns Admin. All users: 3. Sign in; confirm: barangay and year: Use assigned account access. Decision: Expense or: collection?: Choose the record path. Budget officer: 4A. Check budget line: and available balance: Budget entry: Super admin. Encoder / Procurement: 5A. Prepare source: case and linked DV: Create / submit: Super admin. Approver: 6A. Review submitted: DV; approve / reject: Assigned Approver or SA. Treasurer: 7A. Record issued: payment reference: Assigned Treasurer or SA. Treasurer / Super admin: 8A. Settle advance: if applicable: Settlement save: Super admin. Collector: 4B. Check payer and: receipt details: Issue receipt: Super admin. Treasurer / Collector: 5B. Match receipts to: deposit / remittance: Confirm batch: Super admin. Auditor / Administrator: 9. Reconcile reports: and follow up findings: Auditor checks; owners fix</desc>
