rce</text><text x="862" y="238" text-anchor="start" font-size="12.4" font-weight="700" fill="#173147">case and linked DV</text><text x="862" y="258" font-size="9.7" fill="#526778">Create / submit: Super admin</text></g></a><a href="../../user-flow-and-role-guide.html#role-approver"><g class="flow-node" data-node-id="s7" data-role="approver"><title>Approver — 6A. Review submitted — DV; approve / reject — Assigned Approver or SA</title><rect x="640" y="180" width="180" height="92" rx="9" fill="#ecf7f1" stroke="#6ea48c" stroke-width="1.3"/><text x="652" y="199" text-anchor="start" font-size="10.4" font-weight="800" fill="#22644b">Approver</text><text x="652" y="222" text-anchor="start" font-size="12.4" font-weight="700" fill="#173147">6A. Review submitted</text><text x="652" y="238" text-anchor="start" font-size="12.4" font-weight="700" fill="#173147">DV; approve / reject</text><text x="652" y="258" font-size="9.7" fill="#526778">Assigned Approver or SA</text></g></a><a href="../../user-flow-and-role-guide.html#role-treasurer"><g class="flow-node" data-node-id="s8" data-role="treasurer"><title>Treasurer — 7A. Record issued — payment reference — Assigned Treasurer or SA</title><rect x="430" y="180" width="180" height="92" rx="9" fill="#ecf7f1" stroke="#6ea48c" stroke-width="1.3"/><text x="442" y="199" text-anchor="start" font-size="10.4" font-weight="800" fill="#22644b">Treasurer</text><text x="442" y="222" text-anchor="start" font-size="12.4" font-weight="700" fill="#173147">7A. Record issued</text><text x="442" y="238" text-anchor="start" font-size="12.4" font-weight="700" fill="#173147">payment reference</text><text x="442" y="258" font-size="9.7" fill="#526778">Assigned Treasurer or SA</text></g></a><a href="../../user-flow-and-role-guide.html#role-treasurer"><g class="flow-node" data-node-id="s9" data-role="treasurer"><title>Treasurer / Super admin — 8A. Settle advance — if applicable — Settlement save: Super admin</title><rect x="220" y="180" width="180" height="9