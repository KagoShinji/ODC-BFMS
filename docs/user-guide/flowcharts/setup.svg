<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 455" width="1040" height="455" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Setup and access: put the right people in the right barangay.</title><desc id="chart-description">Follow the account setup sequence before any financial work. A barangay sign-in link identifies the workspace; saved membership and page choices determine access. Super admin: 1. Onboard barangay: White label screen: Save name and sign-in slug. Super admin: 2. Set logo, name: and accent color: Save barangay branding. Super admin: 3. Add barangay: Administrator: Staff &amp; access → Add account. Administrator: 4. Add staff; choose: roles and page access: Review → confirm Add account. All users: 5. Sign in using: barangay link: Use your email and password. Decision: Access: available?: Account / page check. All users: 6. Change temporary: password in Settings: Live: Account password. All users: 7. Confirm barangay: and fiscal year: Open your permitted work area. Assigned staff: 8. Follow your: role playbook: Keep the same record reference. Administrator: Check membership: and selected pages: Super admin fixes Admin access. All users: 9. Finish work: and sign out: Profile menu → Sign out</desc>
