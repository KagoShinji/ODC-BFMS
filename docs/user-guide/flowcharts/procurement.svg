<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 455" width="1040" height="455" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Procurement: PR, quotations, Purchase Order and inspection.</title><desc id="chart-description">Procurement officer (PO) coordinates the document work; Super admin advances the current system stages. A Purchase Order is a document stage, distinct from the PO role abbreviation. Encoder / Procurement: 1. Identify purchase: and existing PR: Check supplier and purpose. Budget officer: 2. Confirm budget: coding and availability: Refer shortfall before proceeding. Super admin: 3. New procurement: Create case → PR: Review and confirm creation. Procurement officer: 4. Check PR work: and request details: SA clicks Complete PR. Procurement officer: 5. Coordinate RFQ: and quotation records: SA clicks Complete RFQ. Procurement officer: 6. Check supplier: and Purchase Order: SA clicks Complete PO. Procurement officer: 7. Coordinate delivery: and AIR inspection: SA clicks Complete AIR. Decision: Documents: ready?: Office check of evidence. Encoder / Super admin: 8. Ready for DV: Check linked source: SA clicks Create DV once. Super admin / Approver: 9. Submit draft DV: then review / decide: Continue in spending chart. Procurement officer: Resolve missing: supporting evidence: Coordinate through office process</desc>
