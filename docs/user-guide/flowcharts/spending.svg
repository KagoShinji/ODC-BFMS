<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Spending: from request to approval and recorded payment.</title><desc id="chart-description">All five expense sources converge on a linked disbursement voucher (DV). Follow the decision labels before passing the same case and voucher references to the next role. Encoder: 1. Check request: and existing records: Payee · purpose · amount. Budget officer: 2. Check coding: and available budget: Budget screen / source case. Decision: Budget: sufficient?: Check; enforced on submission. Encoder / Procurement: 3. Prepare source: case and evidence: Create case: Super admin. Encoder / Super admin: 4. Create linked DV: and Submit for review: Live save: Super admin. Approver: 5. Open Submitted DV: and review evidence: Verify amount, source, coding. Decision: Approve: or Reject?: Confirm the chosen action. Treasurer: 6. Verify issued: payment evidence: Approved DV only. Treasurer: 7. Enter reference: Record payment: Confirm → check Paid status. Auditor / finance users: 8. Reconcile records: and report previews: Travel advance? See next chart. Budget officer / SA: Resolve shortfall: or incorrect coding: Budget changes: Super admin. Encoder / Super admin: Retain rejected DV: Correct via a new case: New case / submission: SA</desc>
