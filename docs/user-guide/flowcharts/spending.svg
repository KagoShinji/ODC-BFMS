t coding</text><text x="442" y="423" font-size="9.7" fill="#526778">Budget changes: Super admin</text></g></a><a href="../../user-flow-and-role-guide.html#role-encoder"><g class="flow-node" data-node-id="v12" data-role="encoder"><title>Encoder / Super admin — Retain rejected DV — Correct via a new case — New case / submission: SA</title><rect x="640" y="345" width="180" height="92" rx="9" fill="#f0f5fa" stroke="#a7bdcb" stroke-width="1.3"/><text x="652" y="364" text-anchor="start" font-size="10.4" font-weight="800" fill="#355569">Encoder / Super admin</text><text x="652" y="387" text-anchor="start" font-size="12.4" font-weight="700" fill="#173147">Retain rejected DV</text><text x="652" y="403" text-anchor="start" font-size="12.4" font-weight="700" fill="#173147">Correct via a new case</text><text x="652" y="423" font-size="9.7" fill="#526778">New case / submission: SA</text></g></a><g aria-label="Yes"><rect x="609.6" y="37" width="30.799999999999997" height="18" rx="4" fill="white"/><text x="625" y="49.4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#355569">Yes</text></g><g aria-label="Submitted"><rect x="907.8" y="136" width="64.4" height="18" rx="4" fill="white"/><text x="940" y="148.4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#355569">Submitted</text></g><g aria-label="Approved"><rect x="595.6" y="156" width="58.8" height="18" rx="4" fill="white"/><text x="625" y="168.4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#355569">Approved</text></g><g aria-label="Paid"><rect x="186.8" y="156" width="36.4" height="18" rx="4" fill="white"/><text x="205" y="168.4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#355569">Paid</text></g><g aria-label="No"><rect x="442.4" y="134" width="25.2" height="18" rx="4" fill="white"/><text x="455" y="146.4" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a63b2c">No</text></g><g aria-label="Rejected"><rect x="700.6" y="306" width="58.8" height="18" rx