<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 455" width="1040" height="455" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Reports and oversight: trace records, investigate and follow up.</title><desc id="chart-description">Review the spending and revenue branches together. Findings return to the responsible owner; staff access issues return to the Administrator or Super admin. Finance users: 1. Confirm barangay: year and visible data: Resolve load errors before review. Budget officer / Auditor: 2. Trace source case: DV and budget use: Compare amount, payee, coding. Treasurer / Auditor: 3. Trace paid DV: and advance balance: Check payment and settlement. Collector / Auditor: 4. Trace receipt: and batch allocations: Matched + unmatched = receipt. Auditor: 5. Inspect audit: actor, time and action: Check linked record references. Decision: Figures and: history agree?: Review against source evidence. Permitted finance users: 6. Export working: report previews: CSV / Print / Save PDF. Administrator: 7. Review outstanding: work and staff access: Correct staff roles / pages. All users: 8. Retain references: and sign out: Follow office retention process. Auditor / record owner: Document findings: and request correction: Authorized role / SA investigates. Super admin: Resolve Admin access: or supported corrections: Retain audit history</desc>
